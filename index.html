<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perpustakaan Digital</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <header>
        <nav class="navbar">
            <div class="nav-brand">
                <i class="fas fa-book"></i>
                <h1>Perpustakaan Digital</h1>
            </div>
            <div class="nav-links">
                <a href="index.html" class="active">Beranda</a>
                <a href="admin.html">Admin</a>
            </div>
        </nav>
    </header>

    <main class="main-content">
        <div class="hero-section">
            <h2>Selamat Datang di Perpustakaan Digital</h2>
            <p>Temukan dan download buku digital</p>
        </div>

        <div class="filters-section">
            <div class="search-box">
                <i class="fas fa-search"></i>
                <input type="text" id="searchInput" placeholder="Cari buku...">
            </div>
            
            <div class="filter-controls">
                <select id="categoryFilter">
                    <option value="">Semua Kategori</option>
                </select>
                
                <select id="authorFilter">
                    <option value="">Semua Penulis</option>
                </select>
            </div>
        </div>

        <div class="books-grid" id="booksGrid">
            <!-- Buku akan dimuat di sini -->
        </div>

        <div class="no-results" id="noResults" style="display: none;">
            <i class="fas fa-book-open"></i>
            <h3>Tidak ada buku ditemukan</h3>
            <p>Coba gunakan kata kunci atau filter yang berbeda</p>
        </div>
    </main>

    <footer>
        <p>&copy; 2025 MKhansa067. All rights reserved.</p>
    </footer>

    <!-- PDF Viewer Modal -->
    <div id="pdfModal" class="modal">
        <div class="modal-content pdf-modal-content">
            <div class="modal-header">
                <h3 id="pdfModalTitle">PDF Viewer</h3>
                <button class="modal-close">&times;</button>
            </div>
            <div class="pdf-container">
                <iframe id="pdfViewer" src="" width="100%" height="600px"></iframe>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
